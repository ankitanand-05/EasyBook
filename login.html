<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBook — Sign In & Access Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ebBg: '#FAFAFA',
            ebCard: '#FFFFFF',
            ebMuted: '#DCDCDC',
            ebDarkCard: '#1C1C1C',
            ebBlack: '#000000',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="login.css">
</head>
<body class="bg-[#FAFAFA] dark:bg-[#121212] text-[#000000] dark:text-[#FAFAFA] transition-colors duration-200 min-h-screen flex flex-col justify-between p-6 md:p-12">
  
  <!-- Top Navigation Header -->
  <header class="flex justify-between items-center w-full max-w-6xl mx-auto">
    <div class="text-2xl font-bold tracking-tight">EasyBook<span class="text-neutral-400">.</span></div>
    <button id="authThemeToggle" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider border border-[#000000] dark:border-[#FFFFFF] rounded-none hover:bg-[#000000] hover:text-[#FFFFFF] dark:hover:bg-[#FFFFFF] dark:hover:text-[#000000] transition-all">
      Theme
    </button>
  </header>

  <!-- Centered Minimalist Editorial Form -->
  <main class="w-full max-w-md mx-auto my-auto bg-[#FFFFFF] dark:bg-[#1C1C1C] border border-[#DCDCDC] dark:border-[#333333] p-8 md:p-10 shadow-sm">
    <div class="mb-8">
      <h1 id="authTitle" class="text-2xl font-bold tracking-tight mb-2">Sign In</h1>
      <p id="authSubtitle" class="text-xs text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Access your organization's resource platform</p>
    </div>

    <!-- Toggle Login / Registration Tab -->
    <div class="flex border-b border-[#DCDCDC] dark:border-[#333333] mb-6">
      <button id="tabLogin" type="button" class="pb-2 text-xs uppercase font-semibold border-b-2 border-[#000000] dark:border-[#FFFFFF] w-1/2 text-left">Login</button>
      <button id="tabRegister" type="button" class="pb-2 text-xs uppercase font-semibold text-neutral-400 w-1/2 text-left">Register</button>
    </div>

    <form id="authForm" class="space-y-4">
      <div id="nameWrapper" class="hidden">
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1">Full Name</label>
        <input type="text" id="authName" placeholder="Alex Morgan" class="w-full bg-[#FAFAFA] dark:bg-[#121212] border border-[#DCDCDC] dark:border-[#333333] px-4 py-3 text-sm focus:outline-none focus:border-black dark:focus:border-white">
      </div>

      <div>
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1">Work Email</label>
        <input type="email" id="authEmail" placeholder="alex@organization.com" required class="w-full bg-[#FAFAFA] dark:bg-[#121212] border border-[#DCDCDC] dark:border-[#333333] px-4 py-3 text-sm focus:outline-none focus:border-black dark:focus:border-white">
      </div>

      <div>
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1">Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" required class="w-full bg-[#FAFAFA] dark:bg-[#121212] border border-[#DCDCDC] dark:border-[#333333] px-4 py-3 text-sm focus:outline-none focus:border-black dark:focus:border-white">
      </div>

      <div id="roleWrapper" class="hidden">
        <label class="block text-[11px] uppercase tracking-wider font-semibold mb-1">Access Role</label>
        <select id="authRole" class="w-full bg-[#FAFAFA] dark:bg-[#121212] border border-[#DCDCDC] dark:border-[#333333] px-4 py-3 text-sm focus:outline-none focus:border-black dark:focus:border-white">
          <option value="user">Standard User</option>
          <option value="manager">Resource Manager</option>
          <option value="admin">System Administrator</option>
        </select>
      </div>

      <p id="authErrorMsg" class="text-xs text-red-500 font-semibold hidden"></p>

      <button type="submit" id="authSubmitBtn" class="w-full bg-[#000000] text-[#FFFFFF] dark:bg-[#FFFFFF] dark:text-[#000000] py-3.5 text-xs uppercase font-semibold tracking-wider hover:opacity-90 transition-opacity">
        Enter EasyBook
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-6xl mx-auto text-xs text-neutral-400 text-center">
    &copy; EasyBook. Intelligent Resource Allocation & Dynamic Scheduling.
  </footer>

  <script src="/function.js"></script>
  <script src="login.js"></script>
</body>
</html>
