<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyBook — Sign In & Register</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hero-text {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .hero-text p {
      color: #888888;
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .auth-card {
      background-color: #141414;
      border: 1px solid #242424;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
    }

    .portal-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: #000000;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .portal-toggle button {
      background: transparent;
      border: none;
      color: #888888;
      padding: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .portal-toggle button.active {
      background-color: #ffffff;
      color: #000000;
    }

    .tab-switch {
      display: flex;
      border-bottom: 1px solid #242424;
      margin-bottom: 24px;
    }

    .tab-switch button {
      flex: 1;
      background: none;
      border: none;
      color: #888888;
      padding: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-switch button.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #aaaaaa;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #000000;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #555555;
    }

    .error-box {
      display: none;
      background-color: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      word-break: break-word;
    }

    .submit-btn {
      width: 100%;
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="hero-text">
    <h1>Book smarter.<br>Use resources better.</h1>
    <p>Institutional resource scheduling with real-time Firebase syncing.</p>
  </div>

  <div class="auth-card">
    <div class="portal-toggle">
      <button type="button" class="active" id="portalCustomerBtn">Customer Portal</button>
      <button type="button" id="portalAdminBtn">Admin Portal</button>
    </div>

    <div class="tab-switch">
      <button type="button" id="tabSignIn">Sign In</button>
      <button type="button" class="active" id="tabRegister">Register</button>
    </div>

    <form id="authForm">
      <div class="form-group" id="nameGroup">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@easybook.io" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="error-box" id="errorBox"></div>

      <button type="submit" class="submit-btn" id="submitBtn">Create Customer Account</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzgqurt9okbcqnD6gs7UEqg-xfVZytV6U",
      authDomain: "easybook-app-9c740.firebaseapp.com",
      projectId: "easybook-app-9c740",
      storageBucket: "easybook-app-9c740.firebasestorage.app",
      messagingSenderId: "591471730753",
      appId: "1:591471730753:web:f33cdadbd9345eaf45e6c0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let mode = 'register';
    let portal = 'customer';

    const tabSignIn = document.getElementById('tabSignIn');
    const tabRegister = document.getElementById('tabRegister');
    const nameGroup = document.getElementById('nameGroup');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const authForm = document.getElementById('authForm');
    const portalCustomerBtn = document.getElementById('portalCustomerBtn');
    const portalAdminBtn = document.getElementById('portalAdminBtn');

    function updateUI() {
      errorBox.style.display = 'none';
      if (mode === 'register') {
        nameGroup.style.display = 'block';
        submitBtn.textContent = portal === 'customer' ? 'Create Customer Account' : 'Create Admin Account';
        tabRegister.classList.add('active');
        tabSignIn.classList.remove('active');
      } else {
        nameGroup.style.display = 'none';
        submitBtn.textContent = portal === 'customer' ? 'Sign In to Customer Portal' : 'Sign In to Admin Portal';
        tabSignIn.classList.add('active');
        tabRegister.classList.remove('active');
      }
    }

    tabSignIn.addEventListener('click', () => { mode = 'signIn'; updateUI(); });
    tabRegister.addEventListener('click', () => { mode = 'register'; updateUI(); });

    portalCustomerBtn.addEventListener('click', () => {
      portal = 'customer';
      portalCustomerBtn.classList.add('active');
      portalAdminBtn.classList.remove('active');
      updateUI();
    });

    portalAdminBtn.addEventListener('click', () => {
      portal = 'admin';
      portalAdminBtn.classList.add('active');
      portalCustomerBtn.classList.remove('active');
      updateUI();
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();

      try {
        if (mode === 'register') {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          if (fullName) {
            await updateProfile(userCredential.user, { displayName: fullName });
          }
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }

        // Redirect based on portal type
        window.location.href = portal === 'admin' ? 'admin.html' : 'dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message.replace('Firebase: ', '');
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    updateUI();
  </script>
</body>
</html>
